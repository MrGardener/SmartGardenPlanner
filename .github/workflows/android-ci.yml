name: Android build and unit tests

# Runs when app code or build files change. Expected to fail until the Phase 1 toolchain upgrade
# (SGP-DWR-001 WP-05) lands: the current build (AGP 8.3 / Kotlin 1.9 / API 34) has never been
# compiled in CI, and a test source file duplicates a production class (DW-1301).
on:
  pull_request:
    paths:
      - "Android App/**"
  push:
    branches: [main]
    paths:
      - "Android App/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble, unit tests, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Android App"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, run unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            Android App/app/build/reports/
            Android App/app/build/test-results/
          if-no-files-found: ignore
